name: Safari Release (macOS + iOS)

# Builds the KJB Reader Safari Web Extension on a GitHub-hosted macOS runner
# and (optionally) uploads signed macOS and iOS packages to App Store Connect.
# Full setup guide: SAFARI-GITHUB.md in the repo root.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the macOS .pkg and iOS .ipa to App Store Connect"
        type: boolean
        default: false
      build_number:
        description: "Unique build number (blank = use the run number)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    env:
      APP_NAME: "KJB Reader"
      BUNDLE_ID: "com.kingjamesbiblereader.kjbreaderforsafari"
      # Validation mode: run without Apple secrets still builds + converts,
      # and attaches the converted Xcode project as an artifact.
      HAS_SIGNING: ${{ secrets.MAC_APP_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Build the Safari extension package
        run: ./build.sh safari

      - name: Diagnose Safari packaging tool
        run: |
          xcodebuild -version
          echo "--- find converter:"; xcrun --find safari-web-extension-converter 2>&1 || true
          echo "--- find packager:";  xcrun --find safari-web-extension-packager  2>&1 || true
          echo "--- converter help:"; xcrun safari-web-extension-converter --help 2>&1 | head -50 || true
          echo "--- packager help:";  xcrun safari-web-extension-packager  --help 2>&1 | head -50 || true

      - name: Convert to an Xcode project
        run: |
          # Xcode 26 calls it packager, Xcode 15/16 converter.
          # Both use --no-open (the old --no-open-xcode spelling is rejected
          # with a misleading 'Please provide a path' error).
          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            TOOL=safari-web-extension-packager
          else
            TOOL=safari-web-extension-converter
          fi
          echo "Using tool: $TOOL"
          xcrun "$TOOL" "$PWD/build/safari" \
            --app-name "$APP_NAME" \
            --bundle-identifier "$BUNDLE_ID" \
            --project-location "$PWD" \
            --swift \
            --copy-resources --no-open --no-prompt --force
          # The converter creates "<location>/<App Name>/<App Name>.xcodeproj"
          test -d "$PWD/$APP_NAME/$APP_NAME.xcodeproj"
          echo "Xcode project created at: $PWD/$APP_NAME/$APP_NAME.xcodeproj"
          # The Safari packager pads extension icons onto a white 1024px canvas,
          # producing a visibly undersized iPhone/iPad Home Screen icon. Replace
          # only the iOS universal icon with the full-bleed hand-drawn artwork.
          IOS_ICON="$PWD/$APP_NAME/Shared (App)/Assets.xcassets/AppIcon.appiconset/universal-icon-1024@1x.png"
          test -f "$IOS_ICON"
          cp "$PWD/store-assets/kjb-1024.png" "$IOS_ICON"
          test "$(sips -g pixelWidth "$IOS_ICON" | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$IOS_ICON" | awk '/pixelHeight/{print $2}')" = "1024"

      - name: Configure exact bundle IDs, versions, platforms, and signing
        run: |
          python3 - <<'PY'
          import os, re
          app = os.environ["APP_NAME"]
          pbx = f"{app}/{app}.xcodeproj/project.pbxproj"
          src = open(pbx).read()
          APP_ID  = "com.kingjamesbiblereader.kjbreaderforsafari"
          EXT_ID  = APP_ID + ".Extension"
          MAC_APP_PROF = "KJB Reader for Safari Distribution"
          MAC_EXT_PROF = "KJB Reader for Safari Ext Distribution"
          IOS_APP_PROF = "KJB Reader iOS App Store"
          IOS_EXT_PROF = "KJB Reader iOS Extension App Store"
          import json as _json
          VER = _json.load(open("manifest.json"))["version"]
          def repl(m):
              block = m.group(0)
              bm = re.search(r'PRODUCT_BUNDLE_IDENTIFIER = \"?([^\";]+)\"?;', block)
              if not bm:
                  return block
              is_ios = 'SDKROOT = iphoneos;' in block or 'iOS (' in block
              is_ext = bm.group(1).endswith('.Extension') or '(Extension)/Info.plist' in block
              bid = EXT_ID if is_ext else APP_ID
              block = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = \"?[^\";]+\"?;',
                             'PRODUCT_BUNDLE_IDENTIFIER = "' + bid + '";', block)
              block = re.sub(r'MARKETING_VERSION = [^;]*;',
                             'MARKETING_VERSION = "%s";' % VER, block)
              if is_ios:
                  # iOS and iPadOS are supported from Safari 17 onward. This
                  # also guarantees CSS Highlight API support for painted,
                  # non-DOM-injected Bible-reference detection.
                  block = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]*;',
                                 'IPHONEOS_DEPLOYMENT_TARGET = 17.0;', block)
                  block = block.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
                  prof = IOS_EXT_PROF if is_ext else IOS_APP_PROF
                  if 'PROVISIONING_PROFILE_SPECIFIER' not in block:
                      block = re.sub(r'(PRODUCT_BUNDLE_IDENTIFIER[^\n]*\n)',
                                     r'\1' + '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + prof + '";\n',
                                     block, count=1)
              else:
                  block = block.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
                  prof = MAC_EXT_PROF if is_ext else MAC_APP_PROF
                  if 'PROVISIONING_PROFILE_SPECIFIER' not in block:
                      block = re.sub(r'(PRODUCT_BUNDLE_IDENTIFIER[^\n]*\n)',
                                     r'\1' + '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + prof + '";\n',
                                     block, count=1)
              if not is_ext:
                  # Keep the extension name concise, but identify the installed
                  # macOS/iPhone/iPad container consistently with its App Store record.
                  if 'INFOPLIST_KEY_CFBundleDisplayName' in block:
                      block = re.sub(r'INFOPLIST_KEY_CFBundleDisplayName = [^;]*;',
                                     'INFOPLIST_KEY_CFBundleDisplayName = "KJB Panel";', block)
                  else:
                      block = block.replace(
                          'buildSettings = {',
                          'buildSettings = {' +
                          '\n\t\t\t\tINFOPLIST_KEY_CFBundleDisplayName = "KJB Panel";', 1)
                  # KJB Reader implements no encryption algorithm. It only
                  # accesses Apple's exempt operating-system HTTPS/TLS stack.
                  if 'ITSAppUsesNonExemptEncryption' not in block:
                      block = block.replace(
                          'PRODUCT_BUNDLE_IDENTIFIER = "' + bid + '";',
                          'PRODUCT_BUNDLE_IDENTIFIER = "' + bid + '";' +
                          '\n\t\t\t\tINFOPLIST_KEY_ITSAppUsesNonExemptEncryption = NO;', 1)
                  if not is_ios and 'LSApplicationCategoryType' not in block:
                      block = block.replace(
                          'PRODUCT_BUNDLE_IDENTIFIER = "' + bid + '";',
                          'PRODUCT_BUNDLE_IDENTIFIER = "' + bid + '";' +
                          '\n\t\t\t\tINFOPLIST_KEY_LSApplicationCategoryType = "public.app-category.reference";', 1)
              return block
          out = re.sub(r'buildSettings = \{.*?\n\t\t\t\};', repl, src, flags=re.S)
          open(pbx, "w").write(out)
          ids = sorted(set(re.findall(r'PRODUCT_BUNDLE_IDENTIFIER = \"?([^\";]+)\"?;', out)))
          assert APP_ID in ids and EXT_ID in ids and "com.kingjamesbiblereader.KJB-Reader" not in out
          assert 'IPHONEOS_DEPLOYMENT_TARGET = 17.0;' in out
          assert 'INFOPLIST_KEY_ITSAppUsesNonExemptEncryption = NO;' in out
          assert 'INFOPLIST_KEY_CFBundleDisplayName = "KJB Panel";' in out
          assert out.count('CODE_SIGN_STYLE = Manual;') >= 2
          assert 'KJB Reader iOS App Store' in out and 'KJB Reader iOS Extension App Store' in out
          print("configured ids:", ids, "| manual App Store signing for macOS and iOS")
          PY

      - name: Import signing certificates
        if: env.HAS_SIGNING == 'true'
        env:
          MAC_APP_P12: ${{ secrets.MAC_APP_CERTIFICATE_P12 }}
          MAC_APP_P12_PASSWORD: ${{ secrets.MAC_APP_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN=ci.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo -n "$MAC_APP_P12" | base64 --decode -o app.p12
          echo -n "$MAC_INSTALLER_P12" | base64 --decode -o installer.p12
          security import app.p12 -P "$MAC_APP_P12_PASSWORD" -A -k "$KEYCHAIN"
          security import installer.p12 -P "$MAC_INSTALLER_P12_PASSWORD" -A -k "$KEYCHAIN"
          IOS_CERTIFICATE_SERIAL=$(openssl pkcs12 -in app.p12 -clcerts -nokeys -passin pass:"$MAC_APP_P12_PASSWORD" 2>/dev/null \
            | openssl x509 -noout -serial | sed 's/^serial=//')
          test -n "$IOS_CERTIFICATE_SERIAL"
          echo "IOS_CERTIFICATE_SERIAL=$IOS_CERTIFICATE_SERIAL" >> "$GITHUB_ENV"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr '\n' ' ')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install provisioning profiles
        if: env.HAS_SIGNING == 'true'
        env:
          MAC_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          MAC_EXTENSION_PROFILE: ${{ secrets.MAC_EXTENSION_PROVISIONING_PROFILE }}
        run: |
          set -eu
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo -n "$MAC_PROFILE" | base64 --decode -o "$PROFILES/KJBReader.provisionprofile"
          if [ -n "$MAC_EXTENSION_PROFILE" ]; then
            echo -n "$MAC_EXTENSION_PROFILE" | base64 --decode -o "$PROFILES/KJBReaderExtension.provisionprofile"
          fi

      - name: Install App Store Connect API key
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_KEY_P8" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Create and install iOS App Store provisioning profiles
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          IOS_APP_BUNDLE_ID: com.kingjamesbiblereader.kjbreaderforsafari
          IOS_EXT_BUNDLE_ID: com.kingjamesbiblereader.kjbreaderforsafari.Extension
          IOS_APP_PROFILE_NAME: KJB Reader iOS App Store
          IOS_EXT_PROFILE_NAME: KJB Reader iOS Extension App Store
          IOS_PROFILE_OUTPUT_DIR: ${{ runner.temp }}/ios-profiles
          IOS_CERTIFICATE_SERIAL: ${{ env.IOS_CERTIFICATE_SERIAL }}
        run: |
          set -eu
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" "$ASC_KEY_PATH"
          ruby scripts/create_ios_profiles.rb
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          cp "$IOS_PROFILE_OUTPUT_DIR"/*.mobileprovision "$PROFILES/"

      - name: Archive and export the Mac App Store package
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUM: ${{ github.event.inputs.build_number != '' && github.event.inputs.build_number || github.run_number }}
        run: |
          set -eu
          PROJ="$PWD/$APP_NAME/$APP_NAME.xcodeproj"
          SCHEME=$(xcodebuild -list -project "$PROJ" -json \
            | python3 -c 'import json,sys; ss=json.load(sys.stdin)["project"]["schemes"]; print(next((s for s in ss if "iOS" not in s and "tvOS" not in s), ss[0]))')
          echo "Using scheme: $SCHEME"
          mkdir -p dist
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=macOS' \
            -archivePath "dist/$APP_NAME.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"
          # Wrap the signed .app into a Mac App Store package ourselves.
          # xcodebuild -exportArchive wrongly validates the Mac Installer
          # certificate against the provisioning profiles (installer certs
          # are never included in profiles), so we use productbuild — the
          # same tool the export step uses to produce the flat package.
          ls "dist/$APP_NAME.xcarchive/Products" || true
          find "dist/$APP_NAME.xcarchive" -maxdepth 3 -name "*.app" || true
          xcrun productbuild \
            --component "dist/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" /Applications \
            --sign "3rd Party Mac Developer Installer: Shawn Hanlin Poh ($APPLE_TEAM_ID)" \
            "dist/$APP_NAME.pkg"
          ls -la dist/*.pkg

      - name: Archive and export the iOS and iPadOS App Store package
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUM: ${{ github.event.inputs.build_number != '' && github.event.inputs.build_number || github.run_number }}
        run: |
          set -eu
          PROJ="$PWD/$APP_NAME/$APP_NAME.xcodeproj"
          SCHEME=$(xcodebuild -list -project "$PROJ" -json \
            | python3 -c 'import json,sys; ss=json.load(sys.stdin)["project"]["schemes"]; print(next(s for s in ss if "(iOS)" in s and "Extension" not in s))')
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "Using iOS scheme: $SCHEME"
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "dist/$APP_NAME-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"
          cat > dist/ExportOptions-iOS.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kingjamesbiblereader.kjbreaderforsafari</key>
              <string>KJB Reader iOS App Store</string>
              <key>com.kingjamesbiblereader.kjbreaderforsafari.Extension</key>
              <string>KJB Reader iOS Extension App Store</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "dist/$APP_NAME-iOS.xcarchive" \
            -exportPath dist/ios-export \
            -exportOptionsPlist dist/ExportOptions-iOS.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          find dist/ios-export -maxdepth 1 -name '*.ipa' -print -quit | grep -q .
          ls -la dist/ios-export/*.ipa

      - name: Upload macOS and iOS builds to App Store Connect
        if: env.HAS_SIGNING == 'true' && github.event.inputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUM: ${{ github.event.inputs.build_number != '' && github.event.inputs.build_number || github.run_number }}
        run: |
          set -eu
          VER=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "Uploading macOS v$VER build $BUILD_NUM (Apple ID 6813502666)"
          xcrun altool --upload-package dist/*.pkg \
            --type macos \
            --apple-id "6813502666" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_NUM" \
            --bundle-short-version-string "$VER" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          IPA=$(find dist/ios-export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          echo "Uploading iOS/iPadOS v$VER build $BUILD_NUM"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Attach macOS and iOS packages as workflow artifacts
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KJB-Reader-Safari-macOS-iOS
          path: |
            dist/*.pkg
            dist/ios-export/*.ipa
          retention-days: 14

      - name: Attach the converted Xcode project (validation mode)
        if: env.HAS_SIGNING != 'true'
        run: |
          zip -qr converted-xcode-project.zip "$APP_NAME"
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING != 'true'
        with:
          name: Safari-conversion-check
          path: converted-xcode-project.zip
          retention-days: 14

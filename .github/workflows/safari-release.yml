name: Safari Release (Mac App Store)

# Builds the KJB Reader Safari Web Extension on a GitHub-hosted macOS runner
# and (optionally) uploads the signed .pkg to App Store Connect.
# Full setup guide: SAFARI-GITHUB.md in the repo root.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the built .pkg to App Store Connect"
        type: boolean
        default: false
      build_number:
        description: "Unique build number (blank = use the run number)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    env:
      APP_NAME: "KJB Reader"
      BUNDLE_ID: "com.kingjamesbiblereader.kjbreaderforsafari"
      # Validation mode: run without Apple secrets still builds + converts,
      # and attaches the converted Xcode project as an artifact.
      HAS_SIGNING: ${{ secrets.MAC_APP_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the Safari extension package
        run: ./build.sh safari

      - name: Diagnose Safari packaging tool
        run: |
          xcodebuild -version
          echo "--- find converter:"; xcrun --find safari-web-extension-converter 2>&1 || true
          echo "--- find packager:";  xcrun --find safari-web-extension-packager  2>&1 || true
          echo "--- converter help:"; xcrun safari-web-extension-converter --help 2>&1 | head -50 || true
          echo "--- packager help:";  xcrun safari-web-extension-packager  --help 2>&1 | head -50 || true

      - name: Convert to an Xcode project
        run: |
          # Xcode 26 calls it packager, Xcode 15/16 converter.
          # Both use --no-open (the old --no-open-xcode spelling is rejected
          # with a misleading 'Please provide a path' error).
          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            TOOL=safari-web-extension-packager
          else
            TOOL=safari-web-extension-converter
          fi
          echo "Using tool: $TOOL"
          xcrun "$TOOL" "$PWD/build/safari" \
            --app-name "$APP_NAME" \
            --bundle-identifier "$BUNDLE_ID" \
            --project-location "$PWD" \
            --swift \
            --copy-resources --no-open --no-prompt --force
          # The converter creates "<location>/<App Name>/<App Name>.xcodeproj"
          test -d "$PWD/$APP_NAME/$APP_NAME.xcodeproj"
          echo "Xcode project created at: $PWD/$APP_NAME/$APP_NAME.xcodeproj"

      - name: Force exact bundle IDs + manual signing in the Xcode project
        run: |
          python3 - <<'PY'
          import os, re
          app = os.environ["APP_NAME"]
          pbx = f"{app}/{app}.xcodeproj/project.pbxproj"
          src = open(pbx).read()
          APP_ID  = "com.kingjamesbiblereader.kjbreaderforsafari"
          EXT_ID  = APP_ID + ".Extension"
          APP_PROF = "KJB Reader for Safari Distribution"
          EXT_PROF = "KJB Reader for Safari Ext Distribution"
          import json as _json
          VER = _json.load(open("manifest.json"))["version"]
          def repl(m):
              block = m.group(0)
              bm = re.search(r'PRODUCT_BUNDLE_IDENTIFIER = "([^"]*)";', block)
              if not bm:
                  return block
              if bm.group(1).endswith(".Extension"):
                  bid, prof = EXT_ID, EXT_PROF
              else:
                  bid, prof = APP_ID, APP_PROF
              block = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = "[^"]*";',
                             'PRODUCT_BUNDLE_IDENTIFIER = "' + bid + '";', block)
              # align the app version with the extension manifest version
              block = re.sub(r'MARKETING_VERSION = [^;]*;',
                             'MARKETING_VERSION = "%s";' % VER, block)
              # App Store requires a category UTI in the app's Info.plist
              if not bm.group(1).endswith(".Extension") \
                 and "LSApplicationCategoryType" not in block:
                  block = block.replace(
                      'PRODUCT_BUNDLE_IDENTIFIER = "' + bid + '";',
                      'PRODUCT_BUNDLE_IDENTIFIER = "' + bid + '";' +
                      '\n\t\t\t\tINFOPLIST_KEY_LSApplicationCategoryType = "public.app-category.reference";',
                      1)
              block = block.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
              if "PROVISIONING_PROFILE_SPECIFIER" not in block:
                  block = re.sub(r'(PRODUCT_BUNDLE_IDENTIFIER[^\n]*\n)',
                                 r'\1' + '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + prof + '";\n',
                                 block, count=1)
              return block
          out = re.sub(r'buildSettings = \{.*?\n\t\t\t\};', repl, src, flags=re.S)
          open(pbx, "w").write(out)
          n = out.count("CODE_SIGN_STYLE = Manual;")
          ids = sorted(set(re.findall(r'PRODUCT_BUNDLE_IDENTIFIER = "([^"]*)";', out)))
          assert n >= 2 and "com.kingjamesbiblereader.KJB-Reader" not in out, "patch failed"
          print("patched:", n, "| ids:", ids)
          PY

      - name: Import signing certificates
        if: env.HAS_SIGNING == 'true'
        env:
          MAC_APP_P12: ${{ secrets.MAC_APP_CERTIFICATE_P12 }}
          MAC_APP_P12_PASSWORD: ${{ secrets.MAC_APP_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN=ci.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo -n "$MAC_APP_P12" | base64 --decode -o app.p12
          echo -n "$MAC_INSTALLER_P12" | base64 --decode -o installer.p12
          security import app.p12 -P "$MAC_APP_P12_PASSWORD" -A -k "$KEYCHAIN"
          security import installer.p12 -P "$MAC_INSTALLER_P12_PASSWORD" -A -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr '\n' ' ')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install provisioning profiles
        if: env.HAS_SIGNING == 'true'
        env:
          MAC_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          MAC_EXTENSION_PROFILE: ${{ secrets.MAC_EXTENSION_PROVISIONING_PROFILE }}
        run: |
          set -eu
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo -n "$MAC_PROFILE" | base64 --decode -o "$PROFILES/KJBReader.provisionprofile"
          if [ -n "$MAC_EXTENSION_PROFILE" ]; then
            echo -n "$MAC_EXTENSION_PROFILE" | base64 --decode -o "$PROFILES/KJBReaderExtension.provisionprofile"
          fi

      - name: Archive and export the Mac App Store package
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUM: ${{ github.event.inputs.build_number != '' && github.event.inputs.build_number || github.run_number }}
        run: |
          set -eu
          PROJ="$PWD/$APP_NAME/$APP_NAME.xcodeproj"
          SCHEME=$(xcodebuild -list -project "$PROJ" -json \
            | python3 -c 'import json,sys; ss=json.load(sys.stdin)["project"]["schemes"]; print(next((s for s in ss if "iOS" not in s and "tvOS" not in s), ss[0]))')
          echo "Using scheme: $SCHEME"
          mkdir -p dist
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=macOS' \
            -archivePath "dist/$APP_NAME.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"
          # Wrap the signed .app into a Mac App Store package ourselves.
          # xcodebuild -exportArchive wrongly validates the Mac Installer
          # certificate against the provisioning profiles (installer certs
          # are never included in profiles), so we use productbuild — the
          # same tool the export step uses to produce the flat package.
          ls "dist/$APP_NAME.xcarchive/Products" || true
          find "dist/$APP_NAME.xcarchive" -maxdepth 3 -name "*.app" || true
          xcrun productbuild \
            --component "dist/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" /Applications \
            --sign "3rd Party Mac Developer Installer: Shawn Hanlin Poh ($APPLE_TEAM_ID)" \
            "dist/$APP_NAME.pkg"
          ls -la dist/*.pkg

      - name: Upload to App Store Connect
        if: env.HAS_SIGNING == 'true' && github.event.inputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUM: ${{ github.event.inputs.build_number != '' && github.event.inputs.build_number || github.run_number }}
        run: |
          set -eu
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_KEY_P8" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          VER=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "uploading v$VER build $BUILD_NUM (apple id 6813502666)"
          xcrun altool --upload-package dist/*.pkg \
            --type macos \
            --apple-id "6813502666" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_NUM" \
            --bundle-short-version-string "$VER" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Attach the .pkg as a workflow artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KJB-Reader-Safari-pkg
          path: dist/*.pkg
          retention-days: 14

      - name: Attach the converted Xcode project (validation mode)
        if: env.HAS_SIGNING != 'true'
        run: |
          zip -qr converted-xcode-project.zip "$APP_NAME"
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING != 'true'
        with:
          name: Safari-conversion-check
          path: converted-xcode-project.zip
          retention-days: 14
